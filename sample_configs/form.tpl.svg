<svg height="{{config.page_size[1]}}" width="{{config.page_size[0]}}" xmlns="http://www.w3.org/2000/svg">
  <style>
    .item{
      fill: transparent;
    }
    .item.odd{
      fill: #85c8ff;
      opacity: 0.4;
    }
    .item-label{
      dominant-baseline: central;
      font-family: Arial;
      font-size: 13px;
      text-anchor:end;
      stroke: black;
    }
    .bubble{
      fill: white;
      stroke: #85c8ff;
      stroke-width:1.5;
    }
    .bubble-label{
      dominant-baseline: central;
      font-family: "Arial light";
      font-size: 11px;
      font-weight:100;
      stroke: none;
      fill: #85c8ff;
      text-anchor: middle;
    }
  </style>
  <rect fill="white" height="{{config.page_size[1]}}" width="{{config.page_size[0]}}"></rect>
  {% for seg in config.segments %}
  <g class="segment" transform="translate({{seg.position[0]}} {{seg.position[1]}})">
    {% for block in seg.item_blocks %}
    {% set k = loop %}
    {% set labels = range(block.labels[0],block.labels[1]+1) %}
    {% if block.bubble_labels is defined %}{% set blabels = block.bubble_labels %}{% else %}{% set blabels = range(1,block.nopts +1)%}{% endif %}
    {% set size_w,size_h = block.item_size %}
    {% set bsize_w,bsize_h = block.bubble_size %}
    <g class="item-block" id="block-{{k}}" transform="translate({{block.position[0]}} {{block.position[1]}})">
      {% for j in range(block.nrows) %}
      <g transform="translate(0 {{j * size_w}})">
        <rect class="item {{ loop.cycle('odd', 'even') }}" width="{{block.nopts * size_w}}" height="{{size_h}}"></rect>
        <text class="item-label" x="-3" y="{{size_h/2}}">{{labels[j]}}</text>
        {% for i in range(block.nopts) %}
        <circle class="bubble" cx="{{i*size_w + (size_w/2)}}" cy="{{size_h/2}}" id="item-{{j}}-{{i}}" r="{{bsize_h/2}}"></circle>
        <text class="bubble-label" x="{{i*size_w + (size_w/2)}}" y="{{size_h/2}}">{{blabels[i]}}</text>
        {% endfor %}
      </g>
      {% endfor %}
    </g>
    {% endfor %}
  </g>
  {% endfor %}
</svg>
