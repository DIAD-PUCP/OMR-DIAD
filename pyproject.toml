[project]
name = "omr-diad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "opencv-python-headless>=4.13.0.92",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "pydantic>=2.12.5",
    "pypdf>=6.9.2",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
    "zxing-cpp>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = ["--cov","--import-mode=importlib"]
testpaths = "tests"
pythonpath = ["src"]
